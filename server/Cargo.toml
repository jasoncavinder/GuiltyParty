[workspace]
members = [
    "crates/gp_scenario",
    "crates/gp_session",
    "crates/gp_server"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
