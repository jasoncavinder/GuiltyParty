<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilty Party - Stage</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #000; color: #fff; margin: 0; padding: 40px; }
        button, input { font: inherit; padding: 8px; }
        input { width: 24rem; max-width: 90vw; }
        h1 { font-size: 3rem; margin-top: 0; }
        .content { margin-top: 20px; font-size: 1.5rem; }
        .status-error { color: #ff8585; }
        .status-ok { color: #7dff9a; }
        li { margin-bottom: 10px; }
    </style>
</head>
<body>
    <main id="stage-container">
        <h1>Guilty Party: Stage</h1>
        <form id="connection-form">
            <label for="server-url">Server address</label>
            <input id="server-url" type="url" required autocomplete="url">
            <button type="submit">Connect Stage</button>
        </form>
        <p id="status" role="status">Not connected.</p>
        <section id="data" class="content" aria-live="polite"></section>
    </main>
    <script type="module" src="stage.js"></script>
</body>
</html>
