name: Prototype checks

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "server/**"
      - "clients/**"
      - "services/remote/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "tooling/check_contract_artifacts.py"
      - "tooling/check_contract_schema.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust.yml"
      - "Makefile"
  push:
    branches: [dev, main]
    paths:
      - "server/**"
      - "clients/**"
      - "services/remote/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "tooling/check_contract_artifacts.py"
      - "tooling/check_contract_schema.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install contract validation tooling
        working-directory: .
        run: npm ci --ignore-scripts --cache .cache/npm
      - name: Validate control-plane contracts
        working-directory: .
        run: make check-contracts
      - name: Test Cloudflare remote service
        working-directory: .
        run: make test-remote
      - name: Validate Cloudflare deployment bundle
        working-directory: .
        run: make check-cloudflare
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Check browser JavaScript syntax
        run: node --check ../clients/host/app.js && node --check ../clients/stage/stage.js
