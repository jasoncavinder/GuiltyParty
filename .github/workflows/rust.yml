name: Prototype checks

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "server/**"
      - "apps/mobile/**"
      - "clients/**"
      - "apps/tv/lg-webos/**"
      - "services/remote/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "tooling/check_contract_artifacts.py"
      - "tooling/check_contract_schema.mjs"
      - "tooling/check_scenario_wasm.mjs"
      - "tooling/build_webos_stage.mjs"
      - "tooling/build_remote_clients.mjs"
      - "tooling/remote_rehearsal_websocket.mjs"
      - "tooling/rehearse_remote_game.mjs"
      - "tooling/rehearse_remote_lifecycle.mjs"
      - "tooling/rehearse_stage_pairing_boundaries.mjs"
      - "tooling/mobile_contracts.py"
      - "tooling/run_contract_generator_spike.py"
      - "tooling/test_mobile_contracts.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust.yml"
      - "Makefile"
  push:
    branches: [dev, main]
    paths:
      - "server/**"
      - "apps/mobile/**"
      - "clients/**"
      - "apps/tv/lg-webos/**"
      - "services/remote/**"
      - "contracts/**"
      - "tests/contracts/**"
      - "tooling/check_contract_artifacts.py"
      - "tooling/check_contract_schema.mjs"
      - "tooling/check_scenario_wasm.mjs"
      - "tooling/build_webos_stage.mjs"
      - "tooling/build_remote_clients.mjs"
      - "tooling/remote_rehearsal_websocket.mjs"
      - "tooling/rehearse_remote_game.mjs"
      - "tooling/rehearse_remote_lifecycle.mjs"
      - "tooling/rehearse_stage_pairing_boundaries.mjs"
      - "tooling/mobile_contracts.py"
      - "tooling/run_contract_generator_spike.py"
      - "tooling/test_mobile_contracts.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/rust.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install contract validation tooling
        working-directory: .
        run: npm ci --ignore-scripts --cache .cache/npm
      - name: Validate control-plane contracts
        working-directory: .
        run: make check-contracts
      - name: Test Cloudflare remote service
        working-directory: .
        run: make test-remote
      - name: Install Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Check native and WebAssembly scenario parity
        working-directory: .
        run: make check-scenario-wasm
      - name: Validate Cloudflare deployment bundle
        working-directory: .
        run: make check-cloudflare
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Check browser JavaScript syntax
        run: node --check ../clients/shared/control-client.js && node --check ../clients/host/app.js && node --check ../clients/companion-web/app.js && node --check ../clients/stage/stage.js && node --check ../apps/tv/lg-webos/shell.js && node --check ../apps/tv/lg-webos/stage-core.js && node --check ../apps/tv/lg-webos/stage.js && node --check ../tooling/build_webos_stage.mjs

  mobile-contracts:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GP_EXPECTED_SWIFT_VERSION: "6.3.3"
      GP_EXPECTED_KOTLIN_VERSION: "2.4.10"
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install contract validation tooling
        run: npm ci --ignore-scripts --cache .cache/npm
      - name: Hydrate locked Rust dependencies
        run: cargo fetch --locked --manifest-path server/Cargo.toml
      - name: Check generated mobile contracts
        run: make check-mobile-contracts
      - name: Test native iPhone Companion
        run: >-
          xcodebuild
          -project apps/mobile/GuiltyPartyCompanion.xcodeproj
          -scheme GuiltyPartyCompanion
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/guiltyparty-ios-derived-data"
          test
      - name: Test native iPad Companion
        run: >-
          xcodebuild
          -project apps/mobile/GuiltyPartyCompanion.xcodeproj
          -scheme GuiltyPartyCompanion
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.5'
          -derivedDataPath "$RUNNER_TEMP/guiltyparty-ios-derived-data"
          test
